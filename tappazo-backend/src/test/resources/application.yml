spring:
  application:
    name: tappazo-backend-test
  datasource:
    url: jdbc:h2:mem:tappazotest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

tappazo:
  jwt:
    secret: test-secret-key-for-jwt-signing-2026-minimum-256-bits-test!
    expiration-ms: 3600000
  google:
    client-id: test-google-client-id
  livekit:
    api-key: test-key
    api-secret: test-secret
    server-url: ws://localhost:7880
