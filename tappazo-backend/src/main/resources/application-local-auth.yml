server:
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:mysql://${LOCAL_DB_HOST:127.0.0.1}:${LOCAL_DB_PORT:3306}/${LOCAL_DB_NAME:tappazo_local}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${LOCAL_DB_USER}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

tappazo:
  minio:
    endpoint: ${LOCAL_MINIO_ENDPOINT:http://127.0.0.1:9000}
  livekit:
    server-url: ${LOCAL_LIVEKIT_SERVER_URL:ws://127.0.0.1:7880}
